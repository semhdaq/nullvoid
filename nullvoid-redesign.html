/* Visualizer */
function*bubble(a){for(let i=0;i<a.length;i++)for(let j=0;j<a.length-i-1;j++){yield[j,j+1];if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];yield[j,j+1]}}}
function*selection(a){for(let i=0;i<a.length;i++){let m=i;for(let j=i+1;j<a.length;j++){yield[m,j];if(a[j]<a[m])m=j}[a[i],a[m]]=[a[m],a[i]];yield[i,m]}}
function*insertion(a){for(let i=1;i<a.length;i++){let j=i;while(j>0&&a[j-1]>a[j]){[a[j],a[j-1]]=[a[j-1],a[j]];yield[j,j-1];j--}yield[j]}}
function*merge(a,l=0,r=a.length-1){if(l>=r)return;const m=(l+r)>>1;yield*merge(a,l,m);yield*merge(a,m+1,r);const L=a.slice(l,m+1),R2=a.slice(m+1,r+1);let i=0,j=0,k=l;while(i<L.length||j<R2.length){a[k]=(j>=R2.length||(i<L.length&&L[i]<=R2[j]))?L[i++]:R2[j++];yield[k];k++}}
function*binary(a,t){let lo=0,hi=a.length-1;while(lo<=hi){const m=(lo+hi)>>1;yield[lo,m,hi];if(a[m]===t){yield{found:m};return}a[m]<t?lo=m+1:hi=m-1}}
const info={bubble:"Bubble sort: O(n²) · best O(n)",selection:"Selection sort: O(n²)",insertion:"Insertion sort: O(n²) · best O(n)",merge:"Merge sort: O(n log n)",binary:"Binary search: O(log n), sorted input"};
let base=[],arr=[],gen=null,timer=null,playing=false,tgt=0,steps=0;
const algs={bubble,selection,insertion,merge,binary};
function draw(act=[],done=false){$("#bars").innerHTML=arr.map((v,i)=>`<i style="height:${v}%" class="${done?"d":act.includes(i)?"a":""}"></i>`).join("");$("#vinfo").textContent=info[$("#alg").value]+" · "+steps+" steps"+($("#alg").value==="binary"?" · target "+tgt:"")}
function reset(newData){stop();steps=0;const a=$("#alg").value;if(newData||!base.length){base=Array.from({length:26},()=>10+Math.floor(Math.random()*90));}
 arr=[...base];if(a==="binary"){arr.sort((x,y)=>x-y);tgt=arr[Math.floor(Math.random()*arr.length)]}gen=a==="binary"?binary(arr,tgt):algs[a](arr);draw()}
function step(){if(!gen)return false;const r=gen.next();if(r.done){draw([],true);stop();gen=null;return false}steps++;const v=r.value;if(v.found!==undefined){arr.forEach((_,i)=>0);draw([v.found]);$("#bars").children[v.found].className="d";stop();gen=null;return false}draw(v);return true}
